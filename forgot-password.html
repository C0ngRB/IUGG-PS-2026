<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — IUGG-PS2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background:#f4f6f8;min-height:100vh;">
<div class="dash-topbar">
  <a href="index.html" style="text-decoration:none;color:inherit;"><div class="dash-brand">IUGG-PS2026<small>Forgot Password</small></div></a>
</div>

<div class="dash-content" style="justify-content:center;">
  <div class="dash-card" style="max-width:440px;width:100%;">
    <h3>Reset Password</h3>

    <div class="form-errors" id="errors"></div>
    <div class="form-errors" id="success" style="background:#d1fae5;border-color:#6ee7b7;color:#065f46;"></div>

    <!-- Step 1: Email -->
    <div id="step1">
      <p style="font-size:13px;color:#4b5563;margin-bottom:14px;">
        Enter your registered email to receive a 6-digit verification code.
      </p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="button" class="btn-gold" style="width:100%" id="sendBtn">Send Verification Code</button>
    </div>

    <!-- Step 2: Code + New Password -->
    <div id="step2" style="display:none;">
      <p style="font-size:13px;color:#065f46;margin-bottom:14px;">
        A verification code has been sent to <strong id="sentEmail"></strong>
      </p>
      <div class="form-group">
        <label>Verification Code</label>
        <input type="text" id="code" placeholder="6-digit code" maxlength="6" required>
        <div class="form-hint">Valid for 10 minutes</div>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" required>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" minlength="8" required>
      </div>
      <button type="button" class="btn-gold" style="width:100%" id="resetBtn">Reset Password</button>
    </div>

    <div class="auth-link">
      <a href="auth.html">← Back to Log In</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(function () {
  var errors = document.getElementById('errors');
  var success = document.getElementById('success');
  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var emailInput = document.getElementById('email');

  document.getElementById('sendBtn').addEventListener('click', async function () {
    var email = emailInput.value.trim();
    errors.innerHTML = '';
    success.innerHTML = '';

    if (!email) {
      errors.innerHTML = '<div>Please enter your email</div>';
      return;
    }

    var btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      await Auth.request('POST', '/auth/forgot-password', { email: email });
      document.getElementById('sentEmail').textContent = email;
      step1.style.display = 'none';
      step2.style.display = '';
      emailInput.value = email;
    } catch (err) {
      errors.innerHTML = '<div>Failed to send code. Please try again.</div>';
    }
    btn.disabled = false;
    btn.textContent = 'Send Verification Code';
  });

  document.getElementById('resetBtn').addEventListener('click', async function () {
    errors.innerHTML = '';
    success.innerHTML = '';

    var email = emailInput.value.trim();
    var code = document.getElementById('code').value.trim();
    var newPw = document.getElementById('newPassword').value;
    var confirm = document.getElementById('confirmPassword').value;

    if (!code || code.length !== 6) {
      errors.innerHTML = '<div>Please enter the 6-digit verification code</div>';
      return;
    }
    if (newPw.length < 8) {
      errors.innerHTML = '<div>New password must be at least 8 characters</div>';
      return;
    }
    if (newPw !== confirm) {
      errors.innerHTML = '<div>Passwords do not match</div>';
      return;
    }

    var btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      await Auth.request('POST', '/auth/reset-password', {
        email: email, code: code, new_password: newPw, confirm_password: confirm
      });
      success.innerHTML = '<div>Password reset successfully! <a href="auth.html" style="color:#065f46;font-weight:600;">Log in now →</a></div>';
      step2.style.display = 'none';
    } catch (err) {
      var msgs = err.errors || ['Reset failed'];
      errors.innerHTML = msgs.map(function (m) { return '<div>' + m + '</div>'; }).join('');
    }
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  });
})();
</script>
</body>
</html>

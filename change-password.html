<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password — IUGG-PS2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background:#f4f6f8;min-height:100vh;">
<div class="dash-topbar">
  <a href="index.html" style="text-decoration:none;color:inherit;"><div class="dash-brand">IUGG-PS2026<small>Change Password</small></div></a>
  <div class="dash-user-info" id="userInfo"></div>
</div>

<div class="dash-content">
  <div class="dash-card" style="max-width:480px;margin:0 auto;">
    <h3>Change Password</h3>
    <form id="changePasswordForm">
      <div class="form-errors" id="errors"></div>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="currentPassword" placeholder="Enter current password" required>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="8">
      </div>
      <button type="submit" class="btn-gold" style="width:100%">Update Password</button>
    </form>
    <div class="auth-link" style="margin-top:16px;">
      <a href="auth.html#forgot">Forgot Password?</a>
    </div>
    <div class="auth-link">
      <a href="dashboard.html">← Back to Dashboard</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(function () {
  if (!Auth.requireAuth()) return;

  var user = Auth.getUser();
  document.getElementById('userInfo').innerHTML =
    '&#128100; ' + user.full_name + ' (' + user.email + ') ' +
    '<button class="btn-outline-sm" onclick="Auth.logout()">Log Out</button>';

  document.getElementById('changePasswordForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var errors = document.getElementById('errors');
    errors.innerHTML = '';

    var current = document.getElementById('currentPassword').value;
    var newPw = document.getElementById('newPassword').value;
    var confirm = document.getElementById('confirmPassword').value;

    if (!current) { errors.innerHTML = '<div>Current password is required</div>'; return; }
    if (newPw.length < 8) { errors.innerHTML = '<div>New password must be at least 8 characters</div>'; return; }
    if (newPw !== confirm) { errors.innerHTML = '<div>Passwords do not match</div>'; return; }

    try {
      await Auth.request('PUT', '/auth/password', {
        current_password: current,
        new_password: newPw,
        confirm_password: confirm
      });
      errors.innerHTML = '<div style="color:#065f46;">Password updated successfully!</div>';
      document.getElementById('changePasswordForm').reset();
    } catch (err) {
      var msgs = err.errors || ['Failed to change password'];
      errors.innerHTML = msgs.map(function (m) { return '<div>' + m + '</div>'; }).join('');
    }
  });
})();
</script>
</body>
</html>
